<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/eduspring.css}">
    <title th:text="${titulo} + ' | EduSpring'">EduSpring</title>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark">
    <a class="navbar-brand" th:href="@{/}">
        <img th:src="@{/img/logo.svg}" alt="Logo EduSpring">
        <span>Edu<span class="spring">Spring</span></span>
    </a>
    <ul class="navbar-nav mr-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/web/turmas}">Turmas</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/web/alunos}">Alunos</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/web/disciplinas}">Disciplinas</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/web/professores}">Professores</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/web/resumo}">Resumo</a></li>
    </ul>
    <a class="nav-link" th:href="@{/swagger-ui.html}">API</a>
</nav>
<footer th:fragment="footer" class="site-footer">
    <div class="container">
        <span class="spring">EduSpring</span> · Escola de Spring · onde o conhecimento brota 🌱
    </div>
</footer>
</body>
</html>
