<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments :: head('Disciplinas')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container mt-4">
    <div class="card brand-card shadow-sm">
        <h1 class="mb-4">Disciplinas</h1>

        <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

        <form th:action="${editarId != null} ? @{/web/disciplinas/{id}/editar(id=${editarId})} : @{/web/disciplinas}"
              th:object="${form}" method="post" class="form-cadastro form-inline mb-4">
            <label class="sr-only" for="nomeDisciplina">Nome da disciplina</label>
            <input id="nomeDisciplina" class="form-control mr-2 mb-2" type="text" th:field="*{nome}"
                   data-mask="texto" data-maxlength="100" maxlength="100"
                   placeholder="Ex.: Banco de Dados">
            <button class="btn btn-primary mb-2" type="submit"
                    th:text="${editarId != null} ? 'Salvar alterações' : 'Cadastrar disciplina'">Cadastrar disciplina</button>
            <a th:if="${editarId != null}" class="btn btn-outline-secondary ml-2" th:href="@{/web/disciplinas}">Cancelar</a>
            <small class="text-danger ml-3" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>
        </form>

        <div class="alert alert-info" th:if="${#lists.isEmpty(disciplinas)}">Nenhuma disciplina cadastrada.</div>

        <div class="table-responsive" th:unless="${#lists.isEmpty(disciplinas)}">
        <table class="table table-striped mb-0">
            <thead class="thead-dark">
            <tr><th>#</th><th>Nome</th><th>Ações</th></tr>
            </thead>
            <tbody>
            <tr th:each="d : ${disciplinas}">
                <td th:text="${d.id()}">1</td>
                <td th:text="${d.nome()}">Nome</td>
                <td>
                    <a class="btn btn-sm btn-outline-secondary mr-1"
                       th:href="@{/web/disciplinas(editar=${d.id()})}">Editar</a>
                    <form th:if="${!d.possuiNotas() and !d.possuiProfessores()}"
                          th:action="@{/web/disciplinas/{id}/remover(id=${d.id()})}" method="post" class="d-inline"
                          onsubmit="return confirm('Excluir esta disciplina?');">
                        <button class="btn btn-sm btn-danger" type="submit">Excluir</button>
                    </form>
                    <button th:if="${d.possuiNotas() or d.possuiProfessores()}"
                            class="btn btn-sm btn-secondary" type="button" disabled
                            th:title="${d.possuiProfessores()} ? 'Exclusão bloqueada: a disciplina possui professores vinculados' : 'Exclusão bloqueada: a disciplina possui notas vinculadas'">Excluir</button>
                </td>
            </tr>
            </tbody>
        </table>
        </div>
    </div>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
