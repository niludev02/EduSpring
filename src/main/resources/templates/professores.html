<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments :: head('Professores')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container mt-4">
    <div class="card brand-card shadow-sm">
        <h1 class="mb-4">Professores</h1>

        <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

        <form th:action="${editarId != null} ? @{/web/professores/{id}/editar(id=${editarId})} : @{/web/professores}"
              th:object="${form}" method="post" class="form-cadastro mb-4">
            <div class="form-row">
                <div class="col-md-5 mb-3">
                    <label for="nome">Nome do professor</label>
                    <input id="nome" class="form-control" type="text" th:field="*{nome}"
                           data-mask="nome" data-maxlength="150" maxlength="150" autocomplete="name"
                           placeholder="Ex.: Carlos Silva">
                    <small class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>
                </div>
                <div class="col-md-7 mb-3">
                    <label for="disciplinaId">Disciplina</label>
                    <select id="disciplinaId" class="form-control" th:field="*{disciplinaId}">
                        <option value="">Selecione uma disciplina disponível</option>
                        <option th:each="d : ${disciplinasDisponiveis}"
                                th:value="${d.id}" th:text="${d.nome}"></option>
                    </select>
                    <small class="text-danger" th:if="${#fields.hasErrors('disciplinaId')}"
                           th:errors="*{disciplinaId}"></small>
                </div>
            </div>

            <div class="mb-3">
                <label>Turmas responsáveis <small class="text-muted">(mínimo 0, máximo 2)</small></label>
                <div class="turmas-opcoes border rounded p-3">
                    <div th:if="${#lists.isEmpty(turmasDisponiveis)}" class="text-muted">
                        Não há turmas disponíveis no momento.
                    </div>
                    <div class="form-check" th:each="t : ${turmasDisponiveis}">
                        <input class="form-check-input turma-checkbox" type="checkbox"
                               th:field="*{turmaIds}" th:value="${t.id}" th:id="'turma-' + ${t.id}">
                        <label class="form-check-label" th:for="'turma-' + ${t.id}"
                               th:text="${t.identificador}"></label>
                    </div>
                </div>
            </div>

            <button class="btn btn-primary" type="submit"
                    th:text="${editarId != null} ? 'Salvar alterações' : 'Cadastrar professor'">
                Cadastrar professor
            </button>
            <a th:if="${editarId != null}" class="btn btn-outline-secondary ml-2"
               th:href="@{/web/professores}">Cancelar</a>
        </form>

        <div class="alert alert-info" th:if="${#lists.isEmpty(professores)}">
            Nenhum professor cadastrado.
        </div>

        <div class="table-responsive" th:unless="${#lists.isEmpty(professores)}">
        <table class="table table-striped mb-0">
            <thead class="thead-dark">
            <tr>
                <th>Nome</th>
                <th>Disciplina</th>
                <th>Turmas responsáveis</th>
                <th class="text-right">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${professores}">
                <td th:text="${p.nome}">Nome</td>
                <td th:text="${p.disciplina}">Disciplina</td>
                <td>
                    <span th:if="${#lists.isEmpty(p.turmas)}" class="text-muted">Nenhuma</span>
                    <span th:unless="${#lists.isEmpty(p.turmas)}" th:each="turma, stat : ${p.turmas}">
                        <span class="badge badge-turma" th:text="${turma}">Turma</span>
                    </span>
                </td>
                <td class="text-right">
                    <a class="btn btn-sm btn-outline-secondary mr-1"
                       th:href="@{/web/professores(editar=${p.id})}">Editar</a>
                    <form th:action="@{/web/professores/{id}/remover(id=${p.id})}" method="post"
                          class="d-inline" onsubmit="return confirm('Excluir este professor?');">
                        <button class="btn btn-sm btn-danger" type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        </div>
    </div>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
